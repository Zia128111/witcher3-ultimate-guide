@media (max-width:479px){ .sk-groups{grid-template-columns:1fr} }

/* ---------- Interactive map ---------- */
.map-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.map-frame{position:relative;border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;background:#0b0b0c}
.map-viewport{position:relative;height:clamp(420px,72vh,820px);overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;
  background:radial-gradient(120% 90% at 50% 40%,#1a1a1c,#0b0b0c)}
.map-viewport.grabbing{cursor:grabbing}
.map-viewport:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-text)}
.map-frame:fullscreen .map-viewport{height:100vh}
.map-layer,.map-tiles,.map-pins{position:absolute;left:0;top:0;transform-origin:0 0}
.map-layer{will-change:transform}
.map-tiles img{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;opacity:0;transition:opacity .3s}
.map-tiles img.on,.map-tiles-old img{opacity:1}
.map-tiles img.missing{display:none}
.pin{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1;cursor:pointer;
  border:1.5px solid rgba(10,10,10,.7);box-shadow:0 2px 6px rgba(0,0,0,.55);transition:filter .15s,opacity .2s}
.pin:hover{filter:brightness(1.25)}
.map-pins.z-low .pin{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;font-size:0;border-width:1px}
.map-pins.z-low .pin.sel{width:24px;height:24px;margin:-12px 0 0 -12px;font-size:13px}
.pin.linked::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#c8a456;border:1.5px solid #0b0b0c}
.map-pins.z-low .pin.linked::after{width:6px;height:6px;top:-3px;right:-3px;border-width:1px}
.pin.found{opacity:.38}
.pin.sel{outline:2px solid #f4efe4;outline-offset:2px;z-index:2;opacity:1}
.pin[hidden]{display:none}
.pin-dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;flex:none;border:1px solid rgba(10,10,10,.5)}
.g-danger{background:#a8322b;color:#f6efe4}
.g-treasure{background:#c8a456;color:#1c160a}
.g-power{background:#efe6cf;color:#5b4310;border-color:#c8a456!important}
.g-quest{background:#2a2c30;color:#efe9dc;border-color:#c8a456!important}
.g-explore{background:#e8e2d5;color:#1d1f22}
.g-service{background:#5b6068;color:#f3efe7}
.map-controls{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.map-controls .btn{background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:var(--shadow)}
.map-card{position:absolute;left:12px;bottom:34px;width:min(360px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-panel);padding:14px 14px 16px;box-shadow:var(--shadow);z-index:4;animation:pop .22s var(--ease) both}
.map-card[hidden]{display:none}
.map-status{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-strong);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.84rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:4;white-space:nowrap}
.map-status.show{opacity:1}
.map-attrib{position:absolute;right:0;bottom:0;margin:0;padding:3px 9px;font-size:.72rem;background:rgba(11,11,12,.78);color:#b3ad9f;border-top-left-radius:var(--r-ctl);z-index:3}
.map-attrib a{color:#ebe5d8}
.map-side{position:sticky;top:calc(var(--topbar) + 20px);max-height:calc(100dvh - var(--topbar) - 40px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:16px;scrollbar-width:thin}
.map-group{border:0;padding:0;margin:16px 0 0}
.map-group legend{font:600 .68rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.14em;color:var(--text-3);margin-bottom:6px;padding:0}
.map-cat{display:flex;align-items:center;gap:9px;padding:5px 2px;cursor:pointer;font-size:.93rem;color:var(--text-2)}
.map-cat:hover{color:var(--text)}
.map-cat .grow{flex:1;min-width:0}
.map-cat input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.map-results{max-height:260px;overflow:auto}
.map-result{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 6px;border-radius:var(--r-ctl);cursor:pointer;color:var(--text)}
.map-result:hover{background:var(--surface-2)}
.map-result .ph{color:var(--text-3)}
@media (max-width:1100px){
  .map-shell{grid-template-columns:1fr}
  .map-side{position:static;max-height:none}
}

  .map-viewport{height:62vh;min-height:360px}
  .map-card{bottom:30px}
