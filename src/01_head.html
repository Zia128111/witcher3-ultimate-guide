.dl-endpick.good{border-left-color:#c8a456}.dl-endpick.dark{border-left-color:#a8362c}.dl-endpick.mid{border-left-color:#6f9fd8}
.dl-endpick.closed{opacity:.5}
.dl-endpick.live{border-color:#c8a456;box-shadow:0 0 0 1px #c8a456 inset}
.dl-endpick:hover{transform:translateX(2px)}
.dl-unknown{display:flex;gap:8px;margin:10px 0 0;font-size:.8rem;color:var(--text-2)}
.dl-codex ul{font-size:.88rem}
.dl-foes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dl-foe{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:.8rem;cursor:pointer}
.dl-foe.plain{cursor:default;color:var(--text-2)}
.dl-foe:not(.plain):hover{border-color:#7a2822}
.dl-foe-pic{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#0d0e0f;color:#5d6168;font-size:.85rem}
.dl-foe-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.dl-foe-pic img.ok{opacity:1}
.ng-gate{display:flex;gap:18px;align-items:center;padding:18px;border-radius:var(--r-panel);border:1px solid #2a2d31;color:#ebe5d8;background:radial-gradient(ellipse at 0% 50%,rgba(90,134,201,.12),transparent 55%),linear-gradient(180deg,#141517,#0d0e0f)}
.ng-gate .label{color:#8a857a}.ng-gate p{margin:4px 0 0;color:#d9d2c3}
.ng-ring{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,#111214 80%,transparent 81%),conic-gradient(#8fb0e0 calc(var(--p)*1%),#24272b 0)}
.ng-ring span{font-size:1.3rem;font-weight:700}.ng-ring small{font-size:.7rem;color:#8a857a}
.ng-cross{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-top:16px;border-radius:var(--r-panel);overflow:hidden;border:1px solid #2a2d31;color:#ebe5d8}
.ng-col{padding:18px}
.ng-col h3{display:flex;align-items:center;gap:8px;font-size:1.3rem;color:#ebe5d8;margin-bottom:10px}
.ng-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ng-col li{padding:7px 10px;border-radius:var(--r-ctl);font-size:.88rem}
.ng-col.keep{background:linear-gradient(180deg,#17130f,#0f0c0a)}
.ng-col.keep h3 .ph{color:#e8c675}
.ng-col.keep li{background:rgba(200,164,86,.08);border:1px solid rgba(200,164,86,.25)}
.ng-col.lose{background:linear-gradient(180deg,#141517,#0d0e0f)}
.ng-col.lose h3 .ph{color:#d1573f}
.ng-col.lose li{color:#8a857a;border:1px dashed #34373c;text-decoration:line-through;text-decoration-color:rgba(209,87,63,.5)}
.ng-river{display:grid;place-items:center;width:56px;font-size:1.6rem;color:#8fb0e0;background:repeating-linear-gradient(180deg,#0f1a26 0 10px,#122133 10px 20px);animation:ngFlow 3s linear infinite}
@keyframes ngFlow{to{background-position:0 40px}}
.ng-scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ng-scale-step{display:flex;gap:10px;padding:12px;border-radius:var(--r-panel);border:1px solid var(--line);background:var(--surface)}
.ng-scale-step span{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#8fb0e0;color:#0d0e0f;font-weight:700;font-size:.85rem}
.ng-scale-step p{margin:0;font-size:.88rem;color:var(--text-2)}
.ng-prep{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:12px}
.ng-rite{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-panel);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.ng-rite input{position:absolute;opacity:0;width:1px;height:1px}
.ng-rite:focus-within{box-shadow:var(--ring)}
.ng-rite-box{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--text-3)}
.ng-rite.on{border-color:color-mix(in srgb,#8fb0e0 50%,var(--line))}
.ng-rite.on .ng-rite-box{background:#8fb0e0;border-color:#8fb0e0;color:#0d0e0f}
.ng-rite.on > span:last-child{color:var(--text-3)}
@media (prefers-reduced-motion:reduce){ .ng-river,.dl-end{animation:none} }
@media (max-width:1100px){ .dl-layout{grid-template-columns:1fr} .dl-side{position:static} }
@media (max-width:767px){
  .dl-board{padding:14px}
  .dl-par{grid-template-columns:1fr}
  .dl-par-note,.dl-wait{margin-left:0}
  .ng-cross{grid-template-columns:1fr}
  .ng-river{width:auto;height:44px}
  .ng-river .ph{transform:rotate(90deg)}
  .ng-gate{flex-direction:column;align-items:flex-start}
}

/* ---------- Market square ---------- */
.mn-market{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);border:1px solid #2a2d31;border-radius:var(--r-panel);overflow:hidden;color:#ebe5d8;
  background:radial-gradient(ellipse at 70% 0%,rgba(200,164,86,.09),transparent 55%),linear-gradient(180deg,#141517,#0d0e0f)}
.mn-market .muted,.mn-market .label{color:#8a857a}
.mn-controls{padding:20px;border-right:1px solid #2a2d31;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.2)}
.mn-controls h2{color:#ebe5d8;font-size:1.6rem}
.mn-controls .muted{margin:0 0 6px;font-size:.9rem}
.mn-controls .label{margin-top:6px}
.mn-items{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mn-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:#16171a;color:#b3ad9f;cursor:pointer;font-size:.84rem;text-align:left;transition:all .2s}
.mn-item .ph{font-size:1.1rem;color:#8a857a}
.mn-item:hover{border-color:#4a4d52;color:#ebe5d8}
.mn-item[aria-pressed="true"]{border-color:#c8a456;color:#ebe5d8;background:linear-gradient(180deg,rgba(200,164,86,.14),transparent),#16171a}
.mn-item[aria-pressed="true"] .ph{color:#e8c675}
.mn-val{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r-ctl);border:1px solid #3c4046;background:#0d0e0f}
.mn-val:focus-within{border-color:#c8a456;box-shadow:0 0 0 3px rgba(200,164,86,.2)}
.mn-coin{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;color:#2a1f0c;
  background:radial-gradient(circle at 35% 30%,#f4dc9a,#c8a456 55%,#8a6a2a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.5)}
.mn-val input{flex:1;min-width:0;border:0;background:none;color:#ebe5d8;font:600 1.4rem var(--font-mono,monospace);outline:none;padding:4px 0}
.mn-places{display:flex;flex-direction:column;gap:6px}
.mn-place{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:#16171a;color:#ebe5d8;cursor:pointer;text-align:left}
.mn-place span{font-size:.76rem;color:#8a857a}
.mn-place:hover{border-color:#4a4d52}
.mn-place[aria-pressed="true"]{border-color:#c8a456;background:linear-gradient(90deg,rgba(200,164,86,.12),transparent 80%),#16171a}
.mn-board{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mn-stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mn-stall{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-panel);border:1px solid #24272b;background:rgba(0,0,0,.28);transition:border-color .3s,opacity .3s}
.mn-stall.none{opacity:.5}
.mn-stall.buys{border-color:#3c4046}
.mn-stall.best{border-color:color-mix(in srgb,#c8a456 60%,#24272b);background:radial-gradient(ellipse at 0% 0%,rgba(200,164,86,.16),transparent 60%),rgba(0,0,0,.28);box-shadow:0 0 24px rgba(200,164,86,.12)}
.mn-sign{position:relative;width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:1.5px solid #3a3d43}
.mn-stall.best .mn-sign{border-color:#c8a456;box-shadow:0 0 16px rgba(200,164,86,.35)}
.mn-sign img{position:absolute;max-width:62%;max-height:62%;opacity:0;transition:opacity .3s}
.mn-sign img.ok{opacity:1}
.mn-sign > .ph{font-size:1.3rem;color:#8a857a}
.mn-sign img.ok + .ph{display:none}
.mn-stall-body{flex:1;min-width:0}
.mn-stall-body b{font:600 1.1rem var(--font-display);color:#ebe5d8}
.mn-tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:#8a857a;white-space:nowrap}
.mn-stall.best .mn-tag{color:#e8c675}
.mn-est{margin-top:6px;font-size:1.35rem;font-weight:600;color:#ebe5d8}
.mn-stall.best .mn-est{color:#e8c675}
.mn-est small{font-size:.76rem;font-weight:400;color:#8a857a;font-family:var(--font-body,inherit)}
.mn-bar{height:4px;border-radius:999px;background:#24272b;margin-top:6px;overflow:hidden}
.mn-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8a6a2a,#e8c675);transition:width .4s var(--ease)}
.mn-stall-body p{margin:8px 0 0;font-size:.8rem;line-height:1.4;color:#8a857a}
.mn-note{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:.8rem;color:#8a857a}
.mn-note .ph{flex:none;margin-top:2px}
.mn-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mn-fact{display:flex;gap:12px;padding:14px;border-radius:var(--r-panel);border:1px solid var(--line);background:var(--surface)}
.mn-fact > .ph{font-size:1.4rem;color:var(--rare);flex:none;margin-top:2px}
.mn-fact b{display:block;margin-bottom:2px}
.mn-fact p{margin:0;font-size:.84rem;color:var(--text-2)}
.mn-trails{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mn-trail{padding:18px;border:1px solid #2b241c;border-radius:var(--r-panel);color:#ebe5d8;background:radial-gradient(ellipse at 0% 0%,rgba(200,164,86,.08),transparent 55%),linear-gradient(180deg,#17130f,#0f0c0a)}
.mn-trail h3{display:flex;align-items:center;gap:8px;color:#ebe5d8;font-size:1.35rem;margin-bottom:14px}
.mn-trail h3 .ph{color:#e8c675}
.mn-trail ol{list-style:none;margin:0;padding:0;position:relative}
.mn-trail ol::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;border-left:2px dashed #4a3e30}
.mn-trail li{position:relative;display:flex;gap:14px;padding-bottom:16px}
.mn-trail li:last-child{padding-bottom:0}
.mn-step{position:relative;width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#2a1f0c;
  background:radial-gradient(circle at 35% 30%,#f4dc9a,#c8a456 55%,#8a6a2a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.6)}
.mn-trail b{color:#ebe5d8}
.mn-trail p{margin:4px 0 0;font-size:.86rem;color:#a39d90}
.mn-notices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:22px 18px;border-radius:var(--r-panel);border:1px solid #2b241c;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 80px),linear-gradient(180deg,#2a1f15,#1c150f)}
.mn-notice{position:relative;padding:22px 16px 16px;border-radius:2px;color:#2a221a;transform:rotate(var(--tilt));transition:transform .25s var(--ease);
  background:linear-gradient(180deg,#e7dcc4,#d6c8a8);box-shadow:0 8px 16px rgba(0,0,0,.45);min-height:140px;display:flex;flex-direction:column;gap:6px}
.mn-notice:hover{transform:rotate(0) translateY(-3px)}
.mn-nail{position:absolute;top:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9a9a9a,#3a3a3a);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.mn-kind{font:600 .66rem var(--font-mono,monospace);letter-spacing:.08em;text-transform:uppercase;color:#7a6a52}
.mn-notice h3{font:600 1.08rem/1.25 var(--font-display);color:#2a221a}
.mn-notice p{margin:0;font-size:.8rem;color:#5a4e3e}
.mn-stamp{align-self:flex-end;margin-top:auto;padding:3px 10px;border:2px solid currentColor;border-radius:4px;font:700 .78rem var(--font-mono,monospace);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-6deg)}
.mn-notice.patched .mn-stamp{color:#8e2a22}
.mn-notice.unverified .mn-stamp{color:#9a6a12}
.mn-notice.reported .mn-stamp{color:#2f6b3a}
.mn-notice.reported{background:linear-gradient(180deg,#e9e2c8,#d5cba6);grid-column:span 2}
.mn-steps{color:#2a221a !important;font-size:.84rem !important}
.mn-ver{font:600 .72rem var(--font-mono,monospace) !important;color:#2f6b3a !important}
.mn-srcs{font-size:.72rem !important}
.mn-srcs a{color:#5a3e1e;text-decoration:underline}
@media (max-width:767px){ .mn-notice.reported{grid-column:auto} }
@media (prefers-reduced-motion:reduce){ .mn-notice{transform:none} .mn-bar i{transition:none} }
@media (max-width:1100px){ .mn-market{grid-template-columns:1fr} .mn-controls{border-right:0;border-bottom:1px solid #2a2d31} .mn-facts{grid-template-columns:1fr 1fr} }
@media (max-width:767px){
  .mn-controls,.mn-board{padding:14px}
  .mn-stalls{grid-template-columns:1fr}
  .mn-trails,.mn-facts{grid-template-columns:1fr}
  .mn-notices{padding:16px 12px}
}

/* ---------- Alchemist's workbench ---------- */
.al-tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.al-tabs .qx-tab .ph{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 50%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.al-tabs .qx-tab[aria-selected="true"]{border-color:var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 14%,transparent),transparent 85%),var(--surface)}
.al-tabs .qx-tab[aria-selected="true"] .ph{background:var(--ac);color:#14120f}
.al-meditate{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;margin-bottom:14px;border-radius:var(--r-panel);border:1px solid var(--line);background:linear-gradient(90deg,rgba(90,134,201,.08),transparent 70%),var(--bg-2)}
.al-meditate .ph{font-size:1.5rem;color:#8fb0e0;flex:none;margin-top:2px}
.al-meditate p{margin:0;color:var(--text-2);font-size:.92rem}
.al-meditate b{color:var(--text)}
.al-search{margin-bottom:12px}
.al-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding:22px 18px 26px;border:1px solid #2b241c;border-radius:var(--r-panel);color:#ebe5d8;
  background:repeating-linear-gradient(180deg,transparent 0 196px,#3a2e22 196px 204px,#1a140f 204px 208px,transparent 208px 214px),linear-gradient(180deg,#17130f,#0f0c0a)}
.al-shelf.ing{background:repeating-linear-gradient(180deg,transparent 0 176px,#3a2e22 176px 184px,#1a140f 184px 188px,transparent 188px 194px),linear-gradient(180deg,#17130f,#0f0c0a)}
.al-vial{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 4px;border:0;border-radius:var(--r-ctl);background:none;color:inherit;cursor:pointer;text-align:center;min-height:170px;transition:transform .22s var(--ease)}
.al-vial:hover{transform:translateY(-4px)}
.al-vial.sel .al-vial-glass{outline:2px solid #f4efe4;outline-offset:3px}
.al-vial-glass{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 62%),radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);
  border:1.5px solid color-mix(in srgb,var(--ac) 45%,#3a3d43);box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 8px 16px rgba(0,0,0,.55)}
.al-vial-glass img{position:absolute;max-width:78%;max-height:78%;opacity:0;transition:opacity .35s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.al-vial-glass img.ok{opacity:1}
.al-vial-glass > .ph{font-size:2rem;color:color-mix(in srgb,var(--ac) 60%,#5d6168)}
.al-vial-glass img.ok + .ph{display:none}
.al-vial-name{font:600 1.02rem/1.15 var(--font-display);margin-top:4px}
.al-vial-fx{font-size:.74rem;line-height:1.3;color:#8a857a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:150px}
.al-qty{position:absolute;top:2px;right:calc(50% - 50px);padding:1px 7px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--rare);color:#1c160a;border:1.5px solid #0d0e0f}
.al-flag{position:absolute;top:4px;left:calc(50% - 50px);color:#d39b4a}
.al-bench{background:linear-gradient(180deg,#141517,#0d0e0f);border-color:#2a2d31;color:#ebe5d8}
.al-bench .muted,.al-bench .kv dt,.al-bench .src,.al-bench .dim{color:#8a857a}.al-bench .kv dd{color:#ebe5d8}.al-bench .src a{color:#b3ad9f}
.al-bench h3{color:#ebe5d8;font-size:1.6rem;margin:2px 0 4px}
.al-bench .btn{background:#1d1f22;border-color:#3c4046;color:#ebe5d8}
.al-ring{position:relative;width:min(100%,320px);aspect-ratio:1;margin:12px auto 4px}
.al-ring svg{position:absolute;inset:0;width:100%;height:100%}
.al-ring .ring{fill:none;stroke:#34373c;stroke-width:1.5}
.al-ring .ring.faint{stroke:#24272b;stroke-dasharray:3 5}
.al-ring line{stroke:color-mix(in srgb,var(--ac) 65%,transparent);stroke-width:2;stroke-dasharray:2 5;animation:alFlow 1.4s linear infinite}
@keyframes alFlow{to{stroke-dashoffset:-14}}
.al-ring-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 65%,color-mix(in srgb,var(--ac) 40%,transparent),transparent 65%),radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);
  border:2px solid var(--ac);box-shadow:0 0 26px color-mix(in srgb,var(--ac) 35%,transparent)}
.al-ring-core img{position:absolute;max-width:74%;max-height:74%;opacity:0;transition:opacity .35s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.al-ring-core img.ok{opacity:1}
.al-ring-core > .ph{font-size:2.4rem;color:var(--ac)}
.al-ring-core img.ok + .ph{display:none}
.al-ring-ing{position:absolute;transform:translate(-50%,-50%);width:21%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:#d9d2c3;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:1.5px solid #3a3d43;transition:border-color .2s,transform .2s var(--ease)}
.al-ring-ing:hover{border-color:var(--ac);transform:translate(-50%,-50%) scale(1.08)}
.al-ring-ing img{position:absolute;max-width:72%;max-height:72%;opacity:0;transition:opacity .3s}
.al-ring-ing img.ok{opacity:1}
.al-ring-ing > .ph{font-size:1.2rem;color:#6aa25c}
.al-ring-ing img.ok + .ph{display:none}
.al-ring-ing b{position:absolute;right:-8%;top:-8%;min-width:24px;height:24px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-size:.72rem;background:var(--ac);color:#14120f;border:2px solid #0d0e0f}
.al-ring-ing span{position:absolute;top:104%;left:50%;transform:translateX(-50%);width:max-content;max-width:110px;font-size:.68rem;line-height:1.15;color:#b3ad9f;text-align:center;padding:1px 4px;border-radius:3px;background:rgba(13,14,15,.85)}
.al-brew{display:flex;align-items:center;gap:8px;margin-top:28px;padding:10px 12px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:rgba(255,255,255,.02)}
.al-brew > span:first-child{margin-right:auto;color:#b3ad9f}
.al-brew-n{min-width:24px;text-align:center;font-size:1.1rem}
.al-foes{display:flex;flex-wrap:wrap;gap:8px}
.al-foe{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid #3c4046;background:#16171a;color:#d9d2c3;cursor:pointer;font-size:.86rem}
.al-foe img{width:34px;height:34px;object-fit:contain;border-radius:50%;background:#0d0e0f}
.al-foe > .ph{width:34px;text-align:center}
.al-foe:hover{border-color:#5a2a26}
.al-ing-hero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.al-vial-glass.big{width:96px;height:96px;flex:none;--ac:#a5824a}
.al-uses{display:flex;flex-direction:column;gap:6px}
.al-use{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:rgba(255,255,255,.02);color:#ebe5d8;cursor:pointer;text-align:left}
.al-use img{width:40px;height:40px;object-fit:contain}
.al-use b{display:block}
.al-use .dim{font-size:.8rem}
.al-use:hover{border-color:#4a4d52}
.al-satchel{border:1px solid #2b241c;border-radius:var(--r-panel);padding:18px;color:#ebe5d8;background:radial-gradient(ellipse at 20% 0%,rgba(165,130,74,.1),transparent 55%),linear-gradient(180deg,#17130f,#0f0c0a)}
.al-satchel .label{color:#8a857a}.al-satchel .dim{color:#8a857a}
.al-satchel .btn{background:#1d1f22;border-color:#3c4046;color:#ebe5d8}
.al-satchel .btn-ghost{background:none;border-color:transparent;color:#b3ad9f}
.al-satchel .linkish{color:#ebe5d8}
.al-satchel-empty{display:flex;gap:12px;align-items:center;color:#b3ad9f}
.al-satchel-empty .ph{font-size:2rem;color:#5d4e3c}
.al-satchel-empty p{margin:0}
.al-sat-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}
.al-sat-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.al-sat-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.al-mini{position:relative;width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:1px solid #3a3d43}
.al-mini img{position:absolute;max-width:80%;max-height:80%;opacity:0}
.al-mini img.ok{opacity:1}
.al-mini > .ph{font-size:.95rem;color:#6aa25c}
.al-mini img.ok + .ph{display:none}
.al-gather{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.al-gem{position:relative;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;border:1px solid #3a2e22;background:rgba(255,255,255,.02);cursor:pointer;font-size:.86rem;color:#d9d2c3;transition:all .2s}
.al-gem input{position:absolute;opacity:0;width:1px;height:1px}
.al-gem:focus-within{box-shadow:var(--ring)}
.al-gem:hover{border-color:#6b5a33}
.al-gem.got{border-color:color-mix(in srgb,var(--ok) 55%,#3a2e22);color:#8a857a;text-decoration:line-through;text-decoration-color:#5d6168}
.al-gem.got .al-mini{border-color:var(--ok)}
@media (max-width:1100px){ .al-tabs{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:767px){
  .al-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .al-shelf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 8px;padding:16px 10px 20px}
  .al-vial-glass{width:70px;height:70px}
  .al-sat-grid{grid-template-columns:1fr}
  .al-ring-ing span{max-width:84px;font-size:.62rem}
}
@media (prefers-reduced-motion:reduce){ .al-ring line{animation:none} }

/* ---------- Armory ---------- */
.gr-crests{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.gr-crest{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px 10px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.gr-crest-medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;color:var(--sc);border:1.5px solid color-mix(in srgb,var(--sc) 55%,transparent);
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--sc) 18%,#2c2e33),#111214 75%);transition:all var(--dur)}
.gr-crest-name{font:600 1.05rem var(--font-display);color:var(--text)}
.gr-crest-sub{font-size:.74rem;color:var(--text-3)}
.gr-crest:hover{border-color:color-mix(in srgb,var(--sc) 60%,var(--line))}
.gr-crest[aria-pressed="true"]{border-color:var(--sc);background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 14%,transparent),transparent 85%),var(--surface)}
.gr-crest[aria-pressed="true"] .gr-crest-medal{background:var(--sc);color:#14120f;box-shadow:0 0 16px color-mix(in srgb,var(--sc) 45%,transparent)}
.gr-stand{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:20px;padding:22px;border:1px solid #2a2d31;border-radius:var(--r-panel);overflow:hidden;isolation:isolate;color:#ebe5d8;
  background:radial-gradient(ellipse at 25% 60%,color-mix(in srgb,var(--sc) 14%,transparent),transparent 60%),linear-gradient(180deg,#141517,#0d0e0f)}
.gr-stand .label{color:#8a857a}.gr-stand .src{color:#8a857a}
.gr-stand-bg{position:absolute;inset:0;z-index:-1}
.gr-stand-bg img{width:100%;height:100%;object-fit:cover;opacity:0;filter:saturate(.5) brightness(.32);transition:opacity .6s}
.gr-stand-bg img.ok{opacity:1}
.gr-stand::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(13,14,15,.2),rgba(13,14,15,.85) 55%)}
.gr-display{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:320px}
.gr-pedestal{position:relative;width:100%;height:340px;display:grid;place-items:center;overflow:hidden}
.gr-pedestal::after{content:"";position:absolute;bottom:4%;left:20%;right:20%;height:18px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--sc) 45%,transparent),transparent 70%);filter:blur(4px);z-index:-1}
.gr-render,.gr-icon-big{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}
.gr-render{mix-blend-mode:lighten}
.gr-icon-big{height:80%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.7))}
.gr-render.ok,.gr-icon-big.ok{opacity:1}
.gr-fallback{position:absolute;font-size:7rem;color:color-mix(in srgb,var(--sc) 35%,transparent);z-index:-1}
.gr-pedestal:has(img.ok) .gr-fallback{display:none}
.gr-arms{text-align:center}
.gr-arms > div{display:flex;gap:18px;justify-content:center;margin-top:6px}
.gr-arm{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:#8a857a}
.gr-arm img{height:78px;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.gr-info h2{font-size:clamp(1.8rem,3.2vw,2.5rem);color:#ebe5d8;margin:4px 0 18px}
.gr-path{position:relative;height:122px;margin:6px 0 10px}
.gr-path svg{position:absolute;left:0;right:0;top:20px;width:100%;height:28px;overflow:visible}
.gr-path line{stroke:#34373c;stroke-width:3;vector-effect:non-scaling-stroke}
.gr-path line.on{stroke:var(--sc);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--sc) 70%,transparent))}
.gr-tier{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;border:0;background:none;color:inherit;cursor:pointer;width:84px}
.gr-tier-medal{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-size:1.6rem;color:#5d6168;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:2px solid #3a3d43;box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.5);transition:all .25s var(--ease)}
.gr-tier-medal img{position:absolute;height:92%;width:auto;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .3s}
.gr-tier-medal img.ok{opacity:.8}
.gr-tier-medal img.ok + .ph{display:none}
.gr-tier:hover .gr-tier-medal{transform:scale(1.06)}
.gr-tier.done .gr-tier-medal{border-color:var(--sc);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--sc) 45%,#2c2e33),#111214 75%);box-shadow:0 0 16px color-mix(in srgb,var(--sc) 40%,transparent)}
.gr-tier.done .gr-tier-medal img.ok{opacity:1}
.gr-tier.sel .gr-tier-medal{outline:2px solid #f4efe4;outline-offset:3px}
.gr-tier.gm .gr-tier-medal{border-color:color-mix(in srgb,#c8a456 70%,#3a3d43)}
.gr-tier-check{position:absolute!important;right:2px;bottom:2px;width:22px;height:22px;border-radius:50%;display:grid!important;place-items:center;font-size:.7rem;background:var(--sc);color:#14120f;border:2px solid #0d0e0f}
.gr-tier-name{font:600 .82rem var(--font-body);color:#d9d2c3}
.gr-tier-lvl{font-size:.72rem;color:#8a857a}
.gr-tier:focus-visible{outline:none}.gr-tier:focus-visible .gr-tier-medal{outline:2px solid #f4efe4;outline-offset:3px}
.gr-tier-card{padding:14px 16px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:rgba(13,14,15,.6)}
.gr-tier-card h3{color:#ebe5d8;font-size:1.3rem;margin-top:2px}
.gr-smith{display:flex;gap:8px;align-items:flex-start;margin:10px 0 8px;color:#b3ad9f;font-size:.93rem}
.gr-smith .ph{color:var(--sc);margin-top:3px}
.gr-smith b{color:#ebe5d8}
.gr-stand .chip{color:#d9d2c3;border-color:#3c4046}
.gr-stand .btn{background:#1d1f22;border-color:#3c4046;color:#ebe5d8}
.gr-vs{width:220px}
.gr-vs .select{height:40px;background:#16171a;border-color:#3c4046;color:#ebe5d8}
.gr-lore{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.gr-plaque{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:18px}
.gr-plaque h3{display:flex;gap:8px;align-items:center;font-size:1.25rem;margin-bottom:10px}
.gr-plaque h3 .ph{color:var(--accent-text)}
.gr-plaque.gold h3 .ph{color:var(--rare)}
.gr-plaque h4{margin:12px 0 4px;font-size:1.05rem}
.gr-plaque p{color:var(--text-2);font-size:.95rem}
.gr-bonus{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.gr-pcs{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#1c160a;background:radial-gradient(circle at 35% 30%,#e8c675,#9c7a2e);border:2px solid #0d0e0f}
.gr-bonus p{margin:6px 0 0}
.gr-cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.gr-cmp-col{border:1px solid var(--line);border-top:3px solid var(--sc);border-radius:var(--r-panel);background:var(--surface);padding:16px}
.gr-cmp-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.gr-cmp-head .ph{color:var(--sc);font-size:1.4rem}
.gr-cmp-head b{font:600 1.25rem var(--font-display)}
.gr-rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.gr-weapon{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid #2a2d31;border-radius:var(--r-panel);overflow:hidden;cursor:pointer;color:#ebe5d8;
  background:linear-gradient(180deg,#141517,#0d0e0f);transition:transform .22s var(--ease),border-color .22s}
.gr-weapon:hover{transform:translateY(-3px);border-color:#4a4d52}
.gr-weapon.sel{outline:2px solid #f4efe4;outline-offset:3px}
.gr-weapon.relic{border-color:color-mix(in srgb,#c8a456 40%,#2a2d31)}
.gr-weapon-art{position:relative;height:120px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#24262a,#0d0e0f 75%)}
.gr-weapon-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;filter:saturate(.8)}
.gr-weapon-art img.ok{opacity:1}
.gr-weapon-art .ph{font-size:3rem;color:#3a3d43}
.gr-weapon-art img.ok + .ph{display:none}
.gr-weapon-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.gr-weapon-body b{font:600 1.15rem var(--font-display)}
.gr-weapon-body > span{font-size:.8rem;color:#8a857a}
.gr-weapon.relic .gr-rarity{color:#c8a456}
.gr-weapon.done{filter:saturate(.9)}
.gr-seal{top:10px;right:10px;bottom:auto}
.gr-insp-art{margin:-18px -18px 14px;height:180px;overflow:hidden;background:#0d0e0f;border-bottom:1px solid var(--line)}
.gr-insp-art img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.gr-insp-art img.ok{opacity:1}
.gr-ladder{display:flex;flex-direction:column;gap:12px}
.gr-rung{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding:16px;border:1px solid #2a2d31;border-radius:var(--r-panel);color:#ebe5d8;background:linear-gradient(180deg,#141517,#0d0e0f)}
.gr-rung.r3{border-color:color-mix(in srgb,#c8a456 45%,#2a2d31);background:radial-gradient(ellipse at 10% 50%,rgba(200,164,86,.1),transparent 60%),linear-gradient(180deg,#141517,#0d0e0f)}
.gr-rung-head{display:flex;gap:12px;align-items:center}
.gr-rung-head b{display:block;font:600 1.3rem var(--font-display)}
.gr-rung-head span{font-size:.82rem;color:#8a857a}
.gr-rung-medal{width:50px;height:50px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:#d9d2c3;background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:2px solid #3a3d43}
.gr-rung.r3 .gr-rung-medal{border-color:#c8a456;color:#c8a456}
.gr-rung.r2 .gr-rung-medal{border-color:#b1332c;color:#e2695e}
.gr-rung-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gr-smith-card{padding:10px 12px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:3px}
.gr-smith-card b{font-weight:600}
.gr-smith-card > span{font-size:.78rem;color:#8a857a}
.gr-smith-card p{font-size:.84rem;color:#b3ad9f;margin:2px 0 6px}
.gr-ladder .btn{background:#1d1f22;border-color:#3c4046;color:#ebe5d8}
.gr-ladder .btn-ghost{background:none;border-color:transparent;color:#b3ad9f}
.gr-ladder .dim{color:#5d6168}
@media (max-width:1100px){ .gr-crests{grid-template-columns:repeat(3,minmax(0,1fr))} .gr-stand{grid-template-columns:1fr} .gr-pedestal{height:280px} .gr-rung{grid-template-columns:1fr} }
@media (max-width:767px){
  .gr-crests{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .gr-crest{padding:10px 4px 8px}.gr-crest-medal{width:40px;height:40px}
  .gr-stand{padding:16px}
  .gr-tier{width:64px}.gr-tier-medal{width:52px;height:52px}.gr-tier-name{font-size:.7rem}
  .gr-path{height:110px}.gr-path svg{top:12px}
  .gr-lore,.gr-cmp{grid-template-columns:1fr}
  .gr-vs{width:100%}
}

/* ---------- Quest journal ---------- */
.qx-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.qx-tab{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);color:var(--text-2);cursor:pointer;font:600 1.12rem var(--font-display);transition:all var(--dur) var(--ease)}
.qx-tab .ph{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-wash)}
.qx-tab .mono{margin-left:auto;font-size:.8rem;color:var(--text-3)}
.qx-tab:hover{color:var(--text);border-color:var(--line-strong)}
.qx-tab[aria-selected="true"]{color:var(--text);border-color:var(--accent);background:linear-gradient(180deg,var(--accent-wash),transparent 85%),var(--surface)}
.qx-tab[aria-selected="true"] .ph{background:var(--accent);color:var(--accent-ink)}
.qx-stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.qx-main{min-width:0}
.qx-board{border:1px solid #2a2d31;border-radius:var(--r-panel);padding:18px 14px 14px;color:#ebe5d8;
  background:radial-gradient(ellipse at 50% 10%,rgba(255,255,255,.035),transparent 50%),repeating-radial-gradient(circle at 50% 30%,transparent 0 46px,rgba(255,255,255,.016) 46px 47px),linear-gradient(180deg,#141517,#0d0e0f)}
.qx-board .src{color:#8a857a}
.qx-canvas{position:relative;width:100%;max-width:560px;margin:0 auto;container-type:inline-size}
.qx-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.qx-lines line{stroke:#2f3236;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.qx-lines line.open{stroke:color-mix(in srgb,var(--tc) 60%,#2f3236);stroke-dasharray:5 5}
.qx-lines line.on{stroke:var(--tc);stroke-width:3;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--tc) 70%,transparent))}
.qx-chapter{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:max-content;max-width:34%;padding:4px 12px;border-radius:8px;background:rgba(14,15,17,.94);box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.qx-chapter.wide{max-width:80%}
.qx-chapter b{display:block;font:600 clamp(.95rem,4.2cqw,1.35rem)/1.1 var(--font-display);color:var(--tc)}
.qx-chapter span{display:block;font-size:clamp(.62rem,2.2cqw,.76rem);letter-spacing:.12em;text-transform:uppercase;color:#8a857a;margin-top:2px}
.qx-chapter.wide b{font-size:clamp(1.1rem,5cqw,1.6rem);color:#d9d2c3}
.qx-node{position:absolute;width:10.5%;transform:translate(-50%,-50%);padding:0;border:0;background:none;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  animation:skIn .5s var(--ease) both;animation-delay:calc(var(--i) * 14ms)}
.qx-medal{position:relative;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:4cqw;color:#8a857a;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:2px solid color-mix(in srgb,var(--tc) 40%,#3a3d43);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.5);transition:transform .2s var(--ease),box-shadow .25s}
.qx-node:hover .qx-medal{transform:scale(1.08)}
.qx-node:focus-visible{outline:none}
.qx-node:focus-visible .qx-medal,.qx-node.sel .qx-medal{outline:2px solid #f4efe4;outline-offset:3px}
.qx-node.done .qx-medal{border-color:var(--tc);color:#fbf6ee;background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--tc) 60%,#2c2e33),color-mix(in srgb,var(--tc) 20%,#111214) 75%);box-shadow:0 0 16px color-mix(in srgb,var(--tc) 45%,transparent)}
.qx-node.next .qx-medal{color:#ebe5d8;border-color:var(--tc);animation:qxPulse 2.4s ease-in-out infinite}
@keyframes qxPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tc) 55%,transparent),0 6px 14px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 8px transparent,0 6px 14px rgba(0,0,0,.5)}}
.qx-badge{position:absolute;right:-6%;top:-6%;width:42%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:2.2cqw;background:#2a1d0c;color:#d39b4a;border:1.5px solid #0d0e0f}
.qx-name{margin-top:4px;width:max-content;max-width:280%;padding:0 5px;border-radius:4px;background:rgba(14,15,17,.82);text-align:center;font-size:clamp(9px,2.3cqw,12.5px);line-height:1.15;color:#b3ad9f;text-shadow:0 1px 3px #000;pointer-events:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qx-node.done .qx-name,.qx-node.next .qx-name{color:#ebe5d8}
.qx-lvl{font-size:clamp(8px,1.9cqw,10.5px);color:#8a857a;pointer-events:none;padding:0 4px;border-radius:3px;background:rgba(14,15,17,.82)}
@container (max-width:440px){ .qx-name{width:300%;font-size:9px} .qx-lvl{display:none} }
.qx-legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:14px;font-size:.8rem;color:#b3ad9f}
.qx-legend span{display:inline-flex;align-items:center;gap:6px}
.qx-legend .ph{color:#d39b4a}
.qx-lg-done{border-color:#c4453a;background:#7a2a24}.qx-lg-next{border-color:#c8a456;box-shadow:0 0 0 3px rgba(200,164,86,.25)}
.qx-misses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.qx-miss{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r-ctl);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-left:3px solid var(--warn);background:var(--bg-2);color:var(--text);cursor:pointer}
.qx-miss .ph{color:var(--warn);font-size:1.2rem;margin-top:2px}
.qx-miss b{display:block}
.qx-miss span span{display:block;font-size:.84rem;color:var(--text-2);margin-top:3px}
.qx-miss:hover{border-color:var(--warn)}
.qx-noticeboard{border:1px solid #2a2d31;border-radius:var(--r-panel);padding:16px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 60px),linear-gradient(180deg,#1d1914,#120f0c)}
.qx-nb-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.qx-noticeboard .chip{color:#d9d2c3;border-color:#4a4036}
.qx-noticeboard .chip[aria-pressed="true"]{background:#d9cdb0;color:#1e1812;border-color:#d9cdb0}
.qx-noticeboard .field > span{color:#b3ad9f}
.qx-notices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px 18px}
.qx-notice{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 14px 16px;border:0;cursor:pointer;color:#2a2219;transform:rotate(var(--tilt));
  background:radial-gradient(ellipse at 50% 40%,#e3d8bd,#cdbf9d 70%,#b5a682);border-radius:2px;
  box-shadow:0 10px 22px rgba(0,0,0,.55),inset 0 0 30px rgba(90,64,30,.25);transition:transform .25s var(--ease),box-shadow .25s}
.qx-notice:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 16px 30px rgba(0,0,0,.6),inset 0 0 30px rgba(90,64,30,.25)}
.qx-notice:focus-visible,.qx-notice.sel{outline:3px solid #f4efe4;outline-offset:4px}
.qx-pin{position:absolute;top:7px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e76c5f,#8d1f18);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.qx-notice-art{width:100%;height:110px;display:grid;place-items:center;margin-bottom:8px}
.qx-notice-art img{max-height:100%;max-width:100%;object-fit:contain;filter:sepia(.55) contrast(1.1) brightness(.9) drop-shadow(0 3px 4px rgba(60,40,20,.4));mix-blend-mode:multiply}
.qx-noart{font-size:3rem;color:rgba(60,40,20,.35)}
.qx-notice-kicker{font:700 .64rem var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:#7a2a24}
.qx-notice-title{font:700 1.2rem/1.1 var(--font-display);margin:4px 0 6px}
.qx-notice-target{font-size:.84rem;color:#4a3d2e}
.qx-notice-meta{margin-top:8px;font:600 .74rem var(--font-mono);color:#5d4e3c}
.qx-notice.done{filter:saturate(.7)}
.qx-seal{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);color:#f3d9d3;font-size:1.2rem;
  background:radial-gradient(circle at 35% 30%,#c4453a,#7a1d16 75%);box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 -2px 4px rgba(0,0,0,.35)}
.qx-types{margin-bottom:4px}
.qx-entries{display:flex;flex-direction:column;gap:6px}
.qx-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:all var(--dur)}
.qx-entry:hover{border-color:var(--line-strong);background:var(--surface-2)}
.qx-entry.sel{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-wash),transparent 80%),var(--surface-2)}
.qx-entry-medal{position:relative;width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#b3ad9f;font-size:1.1rem;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:1.5px solid #3a3d43}
.qx-entry-medal img{position:absolute;inset:-14%;width:128%;height:128%;object-fit:contain}
.qx-entry-medal img + .ph{display:none}
.qx-entry.done .qx-entry-medal{border-color:var(--accent);color:#fbf6ee;background:radial-gradient(circle at 35% 28%,#7a2a24,#1e0f0d 75%)}
.qx-entry-main{flex:1;min-width:0;display:flex;flex-direction:column}
.qx-entry-name{font-weight:500}
.qx-entry.done .qx-entry-name{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.qx-entry-meta{font-size:.8rem;color:var(--text-3)}
.qx-entry .tag{flex:none}
.qx-inspector{position:sticky;top:calc(var(--topbar) + 16px);max-height:calc(100dvh - var(--topbar) - 32px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:18px;scrollbar-width:thin}
.qx-insp-empty{text-align:center;padding:24px 6px}
.qx-insp-empty > .ph{font-size:2.6rem;color:var(--text-3)}
.qx-insp-empty h3{margin:10px 0 6px}
.qx-insp-head{display:flex;gap:12px;align-items:flex-start}
.qx-insp-head h3{font-size:1.5rem;margin:2px 0 6px}
.qx-medal.lg{width:56px;height:56px;flex:none;font-size:24px;border-color:var(--tc);color:#fbf6ee;background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--tc) 55%,#2c2e33),color-mix(in srgb,var(--tc) 20%,#111214) 75%)}
.qx-status{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text-2)}
.qx-status.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok)}
.qx-status.next{border-color:color-mix(in srgb,var(--rare) 55%,transparent);color:var(--rare)}
.qx-done{background:var(--bg-2);border-color:var(--line-strong);color:var(--text)}
.qx-foe{display:flex;gap:12px;align-items:center;width:100%;margin-top:16px;padding:10px 12px;text-align:left;border-radius:var(--r-panel);border:1px solid #2a2d31;cursor:pointer;color:#ebe5d8;
  background:radial-gradient(ellipse at 15% 50%,rgba(177,51,44,.18),transparent 60%),linear-gradient(180deg,#141517,#0d0e0f)}
.qx-foe img{width:72px;height:72px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.qx-foe > .ph{font-size:2rem;width:72px;text-align:center;color:#5d6168}
.qx-foe b{display:block;font:600 1.15rem var(--font-display);margin-top:2px}
.qx-foe .dim{display:block;font-size:.82rem;color:#8a857a}
.qx-foe .label{color:#8a857a}
.qx-foe-link{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;color:#e2695e;margin-top:4px}
.qx-foe:hover{border-color:#5a2a26}
.qx-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.qx-steps li{padding:9px 12px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--bg-2);font-size:.93rem;color:var(--text-2)}
.qx-steps li .check{align-items:flex-start}
.qx-steps li .check input{margin-top:2px}
.qx-steps li.done{color:var(--text-3)}
.qx-steps li.done span{text-decoration:line-through;text-decoration-color:var(--line-strong)}
@media (max-width:1100px){
  .qx-stage{grid-template-columns:1fr}
  .qx-inspector{position:static;max-height:none;scroll-margin-top:calc(var(--topbar) + 12px)}
}
@media (max-width:767px){
  .qx-tabs{grid-template-columns:1fr}
  .qx-tab{padding:8px 12px}
  .qx-misses{grid-template-columns:1fr}
  .qx-notices{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
  .qx-board{padding:14px 6px 10px}
}
@media (prefers-reduced-motion:reduce){ .qx-node.next .qx-medal{animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 45%,transparent)} }

/* ---------- Gwent cabinet ---------- */
.gw-hall{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 20px;align-items:center;margin-bottom:18px}
.gw-tally .pct small{font-size:.9rem}
.gw-banners,.gw-factions{display:flex;flex-wrap:wrap;gap:8px}
.gw-banner{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 14px 0 6px;border-radius:var(--r-panel);border:1px solid var(--line);background:var(--surface);color:var(--text-2);cursor:pointer;font:600 1.02rem var(--font-display);transition:all var(--dur) var(--ease)}
.gw-banner .ph{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 55%,transparent);background:color-mix(in srgb,var(--fc) 10%,transparent)}
.gw-banner .mono{font-size:.74rem;color:var(--text-3);font-family:var(--font-mono)}
.gw-banner:hover{color:var(--text);border-color:color-mix(in srgb,var(--fc) 60%,var(--line))}
.gw-banner[aria-pressed="true"]{color:var(--text);border-color:var(--fc);background:linear-gradient(180deg,color-mix(in srgb,var(--fc) 16%,transparent),transparent 85%),var(--surface)}
.gw-banner[aria-pressed="true"] .ph{background:var(--fc);color:#f6efe4}
.gw-ability{grid-column:1/-1;display:flex;gap:10px;align-items:center;margin:0;padding:10px 14px;border-radius:var(--r-ctl);border-left:3px solid var(--fc);background:color-mix(in srgb,var(--fc) 8%,var(--bg-2));color:var(--text-2);font-size:.94rem}
.gw-ability .ph{color:var(--fc);font-size:1.2rem;flex:none}
.gw-ability strong{color:var(--text)}
.gw-cabinet{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.gw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px 14px}
.gw-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.gw-cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.gw-card{position:relative;display:block;width:100%;aspect-ratio:26/50;padding:0;border:0;background:none;cursor:pointer;color:#ebe5d8;text-align:center;border-radius:10px;container-type:inline-size;transition:transform .22s var(--ease)}
.gw-card:hover{transform:translateY(-4px)}
.gw-card:focus-visible{outline:none;box-shadow:none}
.gw-card:focus-visible .gw-frame,.gw-card.sel .gw-frame{outline:2px solid #f4efe4;outline-offset:3px}
.gw-frame{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border-radius:10px;
  border:2px solid color-mix(in srgb,var(--fc) 70%,#2a2d31);
  background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--fc) 24%,#1c1d20),#0f1012 72%);
  box-shadow:inset 0 0 0 3px #0d0e0f,inset 0 0 0 4px color-mix(in srgb,var(--fc) 32%,transparent),0 10px 22px rgba(0,0,0,.45);transition:filter .25s,box-shadow .25s}
.gw-card:hover .gw-frame{box-shadow:inset 0 0 0 3px #0d0e0f,inset 0 0 0 4px color-mix(in srgb,var(--fc) 55%,transparent),0 14px 28px rgba(0,0,0,.55),0 0 16px color-mix(in srgb,var(--fc) 30%,transparent)}
.gw-card.hero .gw-frame{border-color:#c8a456;box-shadow:inset 0 0 0 3px #0d0e0f,inset 0 0 0 4px rgba(200,164,86,.55),0 0 18px rgba(200,164,86,.22),0 10px 22px rgba(0,0,0,.45)}
.gw-str{position:absolute;top:6%;left:7%;z-index:2;width:28cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 13cqw/1 var(--font-mono);
  color:#14120f;background:radial-gradient(circle at 35% 30%,#f4eee2,#b9b0a0);border:2px solid #0d0e0f;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gw-card.hero .gw-str{color:#ecc978;background:radial-gradient(circle at 35% 30%,#3c3120,#120f0a);border-color:#c8a456}
.gw-str-ico{font-size:13cqw;color:#ebe5d8;background:radial-gradient(circle at 35% 30%,#33363b,#121315)}
.gw-portrait{position:relative;flex:1;display:grid;place-items:center}
.gw-emblem{font-size:44cqw;color:color-mix(in srgb,var(--fc) 70%,#ebe5d8);opacity:.42;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--fc) 40%,transparent))}
.gw-row{position:absolute;left:7%;bottom:4%;width:22cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:11cqw;background:#0d0e0f;border:1px solid color-mix(in srgb,var(--fc) 55%,#34373c);color:#d9d2c3}
.gw-glyphs{position:absolute;right:7%;bottom:4%;display:flex;gap:2px}
.gw-glyphs .ph{width:20cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:10cqw;background:#0d0e0f;border:1px solid #34373c;color:var(--rare)}
.gw-name{padding:5cqw 5cqw 1cqw;font:600 10.5cqw/1.08 var(--font-display);border-top:1px solid color-mix(in srgb,var(--fc) 45%,transparent);background:linear-gradient(0deg,#0d0e0f 40%,rgba(13,14,15,.6));
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gw-sub{padding:0 5cqw 6cqw;font:600 6cqw/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#8a857a;background:#0d0e0f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-card.missing .gw-frame{filter:grayscale(.9) brightness(.5)}
.gw-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transition:opacity .35s}
.gw-card.img-ok .gw-img{opacity:1}
.gw-card.img-ok .gw-frame{border-width:1px;border-color:color-mix(in srgb,var(--fc) 55%,#2a2d31);border-radius:8px;box-shadow:0 10px 22px rgba(0,0,0,.5)}
.gw-card.img-ok:hover .gw-frame{box-shadow:0 14px 28px rgba(0,0,0,.6),0 0 0 1px var(--fc),0 0 18px color-mix(in srgb,var(--fc) 35%,transparent)}
.gw-card.img-ok.hero .gw-frame{border-color:#c8a456;box-shadow:0 0 16px rgba(200,164,86,.3),0 10px 22px rgba(0,0,0,.5)}
.gw-card.img-ok .gw-frame > :not(.gw-img){display:none}
.gw-missing{position:absolute;left:0;right:0;top:44%;z-index:3;padding:4px 0;font:600 7cqw var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:#d9d2c3;background:rgba(13,14,15,.82);border-top:1px solid #34373c;border-bottom:1px solid #34373c}
.gw-count{position:absolute;top:5%;right:6%;z-index:3;padding:1px 6px;border-radius:999px;font:600 9cqw var(--font-mono);background:var(--rare);color:#1c160a;border:1.5px solid #0d0e0f}
.gw-own{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--bg-2);color:var(--text-3);font-size:.82rem;cursor:pointer;transition:all var(--dur)}
.gw-own:hover{color:var(--text);border-color:var(--line-strong)}
.gw-own.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.gw-inspector{position:sticky;top:calc(var(--topbar) + 16px);max-height:calc(100dvh - var(--topbar) - 32px);overflow:auto;border:1px solid #2a2d31;border-radius:var(--r-panel);padding:18px;color:#ebe5d8;scrollbar-width:thin;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.035),transparent 55%),linear-gradient(180deg,#141517,#0d0e0f)}
.gw-inspector .muted,.gw-inspector .kv dt{color:#8a857a}.gw-inspector .kv dd{color:#ebe5d8}.gw-inspector .src{color:#8a857a}.gw-inspector .src a{color:#b3ad9f}
.gw-inspector h3{color:#ebe5d8;font-size:1.5rem;margin:4px 0 12px}
.gw-insp-empty{text-align:center;padding:30px 8px;color:#b3ad9f}
.gw-insp-empty > .ph{font-size:2.6rem;color:#5d6168}
.gw-insp-empty h3{margin:10px 0 6px}
.gw-key{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin-top:14px;font-size:.82rem}
.gw-key span{display:inline-flex;gap:5px;align-items:center}
.gw-insp-card{width:min(220px,70%);margin:0 auto 16px}
.gw-insp-card .gw-card{cursor:default}.gw-insp-card .gw-card:hover{transform:none}
.gw-copies{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border:1px solid #2f3236;border-radius:var(--r-ctl)}
.gw-copies > span:first-child{margin-right:auto;color:#b3ad9f}
.gw-inspector .btn{background:#1d1f22;border-color:#3c4046;color:#ebe5d8}
.gw-inspector .fav-btn[aria-pressed="true"]{color:var(--rare)}
.gw-table{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;margin-top:14px;border:1px solid #2a2d31;border-radius:var(--r-panel);overflow:hidden;color:#ebe5d8;
  background:radial-gradient(ellipse at 60% 40%,color-mix(in srgb,var(--fc) 9%,#16171a),#0c0d0e 75%)}
.gw-table .src{color:#8a857a}
.gw-table-side{padding:18px;border-right:1px solid #2a2d31;display:flex;flex-direction:column;gap:14px;background:rgba(0,0,0,.18)}
.gw-leader-slot{width:150px;margin:0 auto}
.gw-slot-empty{aspect-ratio:26/50;border:2px dashed #3c4046;border-radius:10px;display:grid;place-items:center;align-content:center;gap:6px;color:#5d6168;font-size:.85rem}
.gw-slot-empty .ph{font-size:1.8rem}
.gw-plaques{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gw-plaques div{padding:8px 10px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:rgba(255,255,255,.02)}
.gw-plaques span{display:block;font-size:.74rem;color:#8a857a;text-transform:uppercase;letter-spacing:.08em}
.gw-plaques b{font-size:1.4rem}
.gw-plaques small{font-size:.75rem;color:#8a857a}
.gw-plaques .ok b{color:#7fa37a}.gw-plaques .bad b{color:#e2695e}.gw-plaques .gold b{color:#c8a456}
.gw-rules{list-style:none;margin:0;padding:0;font-size:.86rem;color:#d39b4a;display:flex;flex-direction:column;gap:5px}
.gw-rules li{display:flex;gap:6px;align-items:flex-start}
.gw-legal{margin:0;color:#7fa37a;display:flex;gap:6px;align-items:center;font-size:.9rem}
.gw-table .gw-ability{background:rgba(255,255,255,.03);color:#b3ad9f;font-size:.85rem}
.gw-table .btn-ghost{color:#b3ad9f}
.gw-board{padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gw-lane{border:1px solid #24272b;border-radius:var(--r-ctl);background:rgba(0,0,0,.22);padding:8px 10px}
.gw-lane-head{display:flex;align-items:center;gap:8px;font:600 .74rem var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:#8a857a;margin-bottom:6px}
.gw-lane-head .ph{color:var(--fc);font-size:1rem}
.gw-lane-head .mono{margin-left:auto;font-size:.9rem;color:#ebe5d8;letter-spacing:0}
.gw-lane-cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;min-height:40px;scrollbar-width:thin}
.gw-lane-cards .gw-card{width:76px;flex:none}
.gw-lane-empty{color:#5d6168;font-size:.84rem;align-self:center}
@media (max-width:1100px){
  .gw-cabinet{grid-template-columns:1fr}
  .gw-inspector{position:static;max-height:none;scroll-margin-top:calc(var(--topbar) + 12px)}
  .gw-table{grid-template-columns:1fr}
  .gw-table-side{border-right:0;border-bottom:1px solid #2a2d31}
}
@media (max-width:767px){
  .gw-hall{grid-template-columns:1fr}
  .gw-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
  .gw-pool{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .gw-banner{height:38px;font-size:.92rem}
}

/* ---------- Bestiary codex ---------- */
.bx-shell{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.bx-index{position:sticky;top:calc(var(--topbar) + 16px);max-height:calc(100dvh - var(--topbar) - 32px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:16px;overflow:hidden}
.bx-progress{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.bx-cats{display:flex;flex-wrap:wrap;gap:6px}
.bx-cat{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--text-2);font-size:.82rem;cursor:pointer;transition:all var(--dur) var(--ease)}
.bx-cat .mono{font-size:.7rem;color:var(--text-3)}
.bx-cat:hover{color:var(--text);border-color:var(--text-3)}
.bx-cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bx-cat[aria-pressed="true"] .mono{color:var(--accent-ink);opacity:.8}
.bx-signs{display:flex;gap:6px;margin:12px 0 10px}
.bx-sign{flex:1;height:36px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--bg-2);color:var(--text-3);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;transition:all var(--dur)}
.bx-sign:hover{color:var(--text)}
.bx-sign[aria-pressed="true"]{color:#f6efe4;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 35%,var(--bg-2));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.bx-list{overflow:auto;margin:0 -8px;padding:0 8px;scrollbar-width:thin;flex:1;min-height:200px}
.bx-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border:0;border-radius:var(--r-ctl);background:none;color:var(--text);cursor:pointer;text-align:left;position:relative;transition:background var(--dur)}
.bx-row + .bx-row{margin-top:2px}
.bx-row:hover{background:var(--surface-2)}
.bx-row.sel{background:linear-gradient(90deg,var(--accent-wash),transparent 85%),var(--surface-2)}
.bx-row.sel::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.bx-emblem{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;color:#b3ad9f;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:1.5px solid #3a3d43;box-shadow:inset 0 2px 0 rgba(255,255,255,.06)}
.bx-row.sel .bx-emblem{border-color:var(--accent);color:#f6efe4}
.bx-row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.bx-row-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-row-sub{font-size:.76rem;color:var(--text-3)}
.bx-glyphs{display:flex;gap:3px;font-size:.78rem;color:color-mix(in srgb,var(--text-3) 45%,transparent)}
.bx-glyphs .on{color:var(--accent-text)}
.bx-seal{position:absolute;left:34px;top:4px;font-size:.9rem;color:var(--rare);background:var(--surface);border-radius:50%}
.bx-row.studied .bx-emblem{border-color:color-mix(in srgb,var(--rare) 60%,#3a3d43)}
.bx-plate-wrap{min-width:0}
.bx-plate{border:1px solid #2a2d31;border-radius:var(--r-panel);overflow:hidden;color:#ebe5d8;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.035),transparent 55%),repeating-radial-gradient(circle at 50% 30%,transparent 0 46px,rgba(255,255,255,.016) 46px 47px),linear-gradient(180deg,#141517,#0d0e0f)}
.bx-plate .muted{color:#b3ad9f}.bx-plate .src{color:#8a857a}.bx-plate .src a{color:#b3ad9f}.bx-plate .label{color:#8a857a}
.bx-empty{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.bx-empty h2{color:#ebe5d8}
.bx-empty p{max-width:48ch}
.bx-emblem.big{width:96px;height:96px;font-size:2.6rem;border-width:2px;color:#d9d2c3}
.bx-legend{display:flex;gap:18px;font-size:.82rem;color:#8a857a;margin-top:6px}
.bx-legend .ph-circle-fill{color:var(--accent-text)}
.bx-head{position:relative;min-height:220px;display:flex;align-items:flex-end;isolation:isolate;border-bottom:1px solid #2a2d31}
.bx-head .img{position:absolute;inset:0;z-index:-2}
.bx-head::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#0f1012 6%,rgba(15,16,18,.55) 55%,rgba(15,16,18,.25))}
.bx-head:not(.has-art)::before{background:radial-gradient(ellipse at 80% 50%,rgba(177,51,44,.12),transparent 60%)}
.bx-head-emblem{position:absolute;right:28px;top:50%;transform:translateY(-50%);z-index:-1;font-size:9rem;color:rgba(235,229,216,.06)}
.bx-head-copy{padding:22px 24px;width:100%}
.bx-head-copy h2{font-size:clamp(2.2rem,4vw,3.2rem);color:#ebe5d8;margin-top:6px}
.bx-study{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid #3c4046;background:rgba(23,24,27,.8);cursor:pointer;color:#ebe5d8;font-weight:500;font-size:.95rem}
.bx-study input{position:absolute;opacity:0;width:1px;height:1px}
.bx-study:focus-within{box-shadow:var(--ring)}
.bx-study.on{border-color:var(--rare);color:var(--rare)}
.bx-plate .fav-btn{background:rgba(23,24,27,.8);color:#ebe5d8;border-color:#3c4046}
.bx-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.bx-sec{padding:22px 24px;border-bottom:1px solid #2a2d31}
.bx-sec:nth-child(odd){border-right:1px solid #2a2d31}
.bx-sec h3{font-size:1.3rem;color:#ebe5d8;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.bx-wheel{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
.bx-wheel svg{position:absolute;inset:0;width:100%;height:100%}
.bx-wheel .ring{fill:none;stroke:#34373c;stroke-width:1.5}
.bx-wheel .ring.faint{stroke:#24272b;stroke-dasharray:3 5}
.bx-wheel line{stroke:#2a2d31;stroke-width:1.5}
.bx-wheel line.on{stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(177,51,44,.8))}
.bx-wheel-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;color:#ebe5d8;
  background:radial-gradient(circle at 35% 28%,#3a2422,#160f0e 75%);border:2px solid #5a2a26;box-shadow:0 0 30px rgba(177,51,44,.25),inset 0 2px 0 rgba(255,255,255,.08)}
.bx-wheel-sign{position:absolute;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;gap:1px;font-size:1.25rem;color:#5d6168;
  background:radial-gradient(circle at 35% 28%,#24262a,#111214 75%);border:1.5px solid #34373c;transition:all .3s var(--ease)}
.bx-wheel-sign b{font:600 .58rem var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.bx-wheel-sign.on{color:#fbf6ee;border-color:var(--accent);background:radial-gradient(circle at 35% 28%,#9a3a32,#3b1714 78%);box-shadow:0 0 18px rgba(177,51,44,.55)}
.bx-kit{display:flex;flex-direction:column;gap:8px}
.bx-socket{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-ctl);border:1px solid #2f3236;background:rgba(255,255,255,.02);color:#ebe5d8;cursor:pointer;transition:border-color var(--dur),background var(--dur)}
.bx-socket:hover:not([disabled]){border-color:var(--rare);background:rgba(200,164,86,.06)}
.bx-socket[disabled]{cursor:default;opacity:.7}
.bx-socket-ico{width:40px;height:40px;flex:none;border-radius:8px;transform:rotate(45deg);display:grid;place-items:center;border:1.5px solid #6b5a33;background:linear-gradient(135deg,#2a2418,#14110c)}
.bx-socket-ico .ph{transform:rotate(-45deg);color:var(--rare);font-size:1.15rem}
.bx-socket-name{display:block;font-weight:600}
.bx-socket-sub{display:block;font-size:.8rem;color:#8a857a;margin-top:2px}
.bx-note{background:linear-gradient(180deg,rgba(200,164,86,.05),transparent 70%)}
.bx-note p{color:#d9d2c3;font-size:.98rem}
.bx-note h3 .ph{color:var(--rare)}
.bx-plate .item + .item{border-top-color:#2a2d31}
.bx-plate .item-title button{color:#ebe5d8}
.bx-plate .chip{color:#b3ad9f;border-color:#3c4046}
.bx-foot{padding:14px 24px;display:flex;flex-direction:column;gap:6px}
@media (max-width:1100px){
  .bx-shell{grid-template-columns:1fr}
  .bx-index{position:static;max-height:none}
  .bx-list{max-height:420px}
  .bx-plate-wrap{scroll-margin-top:calc(var(--topbar) + 12px)}
}
@media (max-width:767px){
  .bx-body{grid-template-columns:1fr}
  .bx-sec:nth-child(odd){border-right:0}
  .bx-sec{padding:18px 16px}
  .bx-head-copy{padding:18px 16px}
  .bx-head{min-height:180px}
}


.bx-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s}
.img-ok > .bx-pic{opacity:1}
.bx-emblem{position:relative;overflow:hidden}
.bx-emblem .bx-pic{inset:-12%;width:124%;height:124%}
.bx-emblem.img-ok > .ph{opacity:0}
.bx-emblem.img-ok{background:radial-gradient(circle at 50% 40%,#2a2c30,#0f1012 75%)}
.bx-wheel-core{overflow:hidden}
.bx-wheel-core .bx-pic{inset:6%;width:88%;height:88%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.bx-wheel-core.img-ok > .ph{opacity:0}
.bx-specimen{position:absolute;right:2%;bottom:-6%;top:4%;width:46%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%,rgba(177,51,44,.16),transparent 65%)}
.bx-specimen .bx-pic{object-position:center bottom;filter:drop-shadow(0 10px 24px rgba(0,0,0,.7))}
.bx-specimen.icon .bx-pic{inset:18%;width:64%;height:64%;object-position:center;border-radius:8px}
.bx-head:has(.bx-specimen) .bx-head-emblem{display:none}
.bx-head:has(.bx-specimen){min-height:280px}
.bx-head.has-art:has(.bx-specimen) .img img{opacity:.45}
.bx-head-copy{position:relative;max-width:62%}
.bx-parade{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:8px 0 4px;height:110px}
.bx-parade span{position:relative;width:86px;height:100%}
.bx-parade .bx-pic{object-position:center bottom;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7)) grayscale(.2)}
@media (max-width:767px){
  .bx-head-copy{max-width:70%}
  .bx-specimen{width:52%;right:-6%}
  .bx-head:has(.bx-specimen){min-height:230px}
  .bx-parade span{width:56px}.bx-parade{height:80px}
}

/* ---------- Skill trees (Remastered) ---------- */
.sk-ledger{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-panel);background:var(--bg-2);margin-bottom:16px}
.sk-led{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.sk-led:last-child{border-right:0}
.sk-led b{font-size:1.7rem;line-height:1.1;font-weight:600}
.sk-led.neg b{color:var(--accent-text)}
.sk-led.zero b{color:var(--rare)}
.sk-led .input{height:34px;width:100%}
.sk-sigils{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sk-sigil{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);color:var(--text-2);cursor:pointer;font:600 1.15rem var(--font-display);transition:border-color var(--dur),background var(--dur),color var(--dur)}
.sk-sigil .ph{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.sk-sigil .mono{margin-left:auto;font-size:.82rem;color:var(--text-3)}
.sk-sigil:hover{border-color:color-mix(in srgb,var(--tc) 60%,var(--line));color:var(--text)}
.sk-sigil[aria-selected="true"]{border-color:var(--tc);color:var(--text);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 14%,transparent),transparent 80%),var(--surface)}
.sk-sigil[aria-selected="true"] .ph{background:var(--tc);color:#f6efe4}
.sk-stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.sk-board{border:1px solid #2a2d31;border-radius:var(--r-panel);padding:18px 18px 14px;color:#ebe5d8;
  background:
    radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.035),transparent 60%),
    repeating-radial-gradient(circle at 50% 42%,transparent 0 46px,rgba(255,255,255,.018) 46px 47px),
    linear-gradient(180deg,#141517,#0d0e0f)}
.sk-board .src{color:#8a857a}
.sk-canvas{position:relative;width:100%;max-width:620px;margin:0 auto;container-type:inline-size}
.sk-watermark{position:absolute;inset:0;display:grid;place-items:center;font:600 17cqw/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--tc);opacity:.06;pointer-events:none;user-select:none}
.sk-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sk-lines line{stroke:#34373c;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round;transition:stroke .3s}
.sk-lines line.open{stroke:color-mix(in srgb,var(--tc) 55%,#34373c);stroke-dasharray:5 5}
.sk-lines line.on{stroke:var(--tc);stroke-width:3;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--tc) 70%,transparent))}
.sk-node{position:absolute;width:12.4%;transform:translate(-50%,-50%);padding:0;border:0;background:none;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  animation:skIn .5s var(--ease) both;animation-delay:calc(var(--i) * 22ms);border-radius:50%}
@keyframes skIn{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}}
.sk-medal{position:relative;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:4.6cqw;color:#8a857a;
  background:radial-gradient(circle at 35% 28%,#2c2e33,#111214 72%);border:2px solid #3a3d43;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.07),inset 0 -6px 12px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.5);transition:transform .2s var(--ease),border-color .25s,box-shadow .25s,color .25s}
.sk-node:hover .sk-medal{transform:scale(1.07)}
.sk-node:focus-visible{outline:none;box-shadow:none}
.sk-node:focus-visible .sk-medal{outline:2px solid #f4efe4;outline-offset:3px}
.sk-node.avail .sk-medal{border-color:color-mix(in srgb,var(--tc) 65%,#3a3d43);color:#d9d2c3;box-shadow:inset 0 2px 0 rgba(255,255,255,.07),0 0 0 3px color-mix(in srgb,var(--tc) 16%,transparent),0 6px 14px rgba(0,0,0,.5)}
.sk-node.has .sk-medal{border-color:var(--tc);color:#fbf6ee;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--tc) 62%,#2c2e33),color-mix(in srgb,var(--tc) 22%,#111214) 75%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 0 18px color-mix(in srgb,var(--tc) 45%,transparent),0 6px 14px rgba(0,0,0,.5)}
.sk-node.max .sk-medal{box-shadow:0 0 0 2px #0d0e0f,0 0 0 4px #c8a456,0 0 22px color-mix(in srgb,var(--tc) 55%,transparent)}
.sk-node.locked .sk-medal{opacity:.5;filter:grayscale(.7)}
.sk-lock{position:absolute;right:-2px;bottom:-2px;font-size:2.4cqw;background:#0d0e0f;border-radius:50%;padding:2px;color:#8a857a}
.sk-node.eq .sk-medal::after{content:"\2605";position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;line-height:1;background:#c8a456;color:#1c160a;border:2px solid #0d0e0f}
.sk-node.sel .sk-medal{outline:2px solid #f4efe4;outline-offset:3px}
.sk-pips{display:flex;gap:3px;margin-top:5px}
.sk-pips i{width:8px;height:3px;border-radius:2px;background:rgba(235,229,216,.16)}
.sk-pips i.on{background:var(--tc);box-shadow:0 0 6px color-mix(in srgb,var(--tc) 70%,transparent)}
.sk-name{margin-top:3px;width:170%;text-align:center;font-size:clamp(9px,2.25cqw,12.5px);line-height:1.15;color:#b3ad9f;text-shadow:0 1px 3px #000;pointer-events:none}
.sk-node.has .sk-name{color:#ebe5d8}
@container (max-width:460px){ .sk-name{display:none} .sk-node.eq .sk-medal::after{width:13px;height:13px;font-size:8px} }
.sk-legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:12px;font-size:.8rem;color:#b3ad9f}
.sk-legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #3a3d43;background:#141517}
.lg-has{border-color:#c4453a;background:#7a2a24}.lg-avail{border-color:#8a5a55}.lg-locked{opacity:.5}.lg-eq{background:#c8a456;border-color:#0d0e0f}
.sk-inspector{position:sticky;top:calc(var(--topbar) + 16px);max-height:calc(100dvh - var(--topbar) - 32px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:18px;scrollbar-width:thin}
.sk-insp-empty{text-align:center}

.sk-sig-big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:4px auto 0;font-size:28px;color:var(--tc);border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.sk-insp-head{display:flex;gap:12px;align-items:flex-start}

.sk-status{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text-2)}

.sk-status.avail{border-color:color-mix(in srgb,var(--rare) 55%,transparent);color:var(--rare)}
.sk-status.locked{color:var(--text-3)}
.sk-ctl{display:flex;align-items:center;gap:8px;margin:16px 0}

.sk-levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.sk-levels li p{margin:4px 0 0;font-size:.93rem;color:var(--text-2)}
.sk-levels li.done{border-left-color:color-mix(in srgb,var(--tc,#c4453a) 50%,var(--line-strong))}
.sk-levels li.cur{border-left-color:var(--tc,#c4453a);background:linear-gradient(90deg,color-mix(in srgb,var(--tc,#c4453a) 12%,transparent),transparent 70%),var(--bg-2)}
.sk-levels li.cur p{color:var(--text)}
.sk-levels li.next{border-style:dashed;border-left-style:solid;border-left-color:var(--rare)}
.sk-passive{font-size:.82rem!important;color:var(--text-3)!important}
.sk-h4{margin:18px 0 8px;font-size:1.1rem}
.sk-diff{list-style:none;margin:0;padding:0;font-size:.9rem}
.sk-diff li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--text-2)}
.sk-diff li + li{border-top:1px solid var(--line)}
.sk-diff b{color:var(--ok);font-weight:600}
.sk-conn{display:flex;flex-direction:column;gap:10px}
.sk-conn > div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sk-conn .dim{font-size:.82rem;margin-right:4px}
.sk-groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.sk-group{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.sk-group.match{border-color:color-mix(in srgb,var(--rare) 60%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--rare) 25%,transparent) inset}
.sk-group.extra{margin-top:12px}
.sk-mutagen{position:relative;align-self:center;width:34px;height:34px;display:grid;place-items:center;font-size:24px;color:var(--line-strong);cursor:pointer}
.sk-mutagen select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.sk-mutagen:focus-within{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:4px}
.sk-mutagen.m-red{color:#c4453a}.sk-mutagen.m-blue{color:#5a86c9}.sk-mutagen.m-green{color:#6aa25c}
.sk-group-slots{display:flex;flex-direction:column;gap:6px}
.sk-slot{display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 10px;border-radius:var(--r-ctl);border:1px solid var(--line);border-left:3px solid var(--tc);background:var(--bg-2);color:var(--text);font-size:.9rem;cursor:pointer;text-align:left;width:100%}
.sk-slot .ph{color:var(--tc)}
.sk-slot span:not(.mono){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-slot .mono{color:var(--text-3);font-size:.78rem}
.sk-slot:hover{border-color:var(--tc)}
.sk-slot.empty{border-style:dashed;border-left-width:1px;color:var(--text-3);cursor:default;justify-content:center}
.sk-group-note{font-size:.8rem;color:var(--text-3);text-align:center;display:flex;gap:5px;justify-content:center;align-items:center}
.sk-group.match .sk-group-note{color:var(--rare)}
.sk-fc-inputs{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.sk-fc-inputs .field{width:170px}
.sk-fc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sk-fc{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);padding:16px}
.sk-fc header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sk-fc header .ph{font-size:1.3rem;color:var(--accent-text)}
.sk-fc-in{display:flex;gap:10px;margin-bottom:10px}
.sk-fc-in .field{flex:1}
.sk-fc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sk-fc-row{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--text-2)}
.sk-fc-row .mono{color:var(--text);white-space:nowrap}
.sk-fc-row em{font-style:normal;font-size:.8rem;margin-left:4px}
.sk-fc-row em.up{color:var(--ok)}.sk-fc-row em.down{color:var(--accent-text)}
.sk-bar{position:relative;height:5px;margin-top:5px;border-radius:3px;background:color-mix(in srgb,var(--text) 6%,transparent)}
.sk-bar .val{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent),var(--accent));transition:width .5s var(--ease)}
.sk-bar .base{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-3);z-index:1}
.sk-totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:14px 0 0;border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.sk-totals > div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sk-totals dt{font-size:.8rem;color:var(--text-3)}
.sk-totals dd{margin:2px 0 0;font-size:1.05rem}
.sk-more{margin-top:28px;padding:0}
.sk-more summary{cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:500;list-style:none}
.sk-more summary::-webkit-details-marker{display:none}
.sk-more summary .mono{margin-left:auto}
.sk-more[open] summary{border-bottom:1px solid var(--line)}
.sk-more > :not(summary){margin-left:16px;margin-right:16px}
.sk-more > p:last-child{margin-bottom:16px}
.sk-muts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px;margin-top:14px}
.sk-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:20px}
@media (max-width:1100px){
  .sk-stage{grid-template-columns:1fr}
  .sk-inspector{position:static;max-height:none}
  .sk-groups{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:767px){
  .sk-ledger{grid-template-columns:repeat(3,minmax(0,1fr))}

  .sk-sigils{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sk-board{padding:12px 8px 10px}
  .sk-fc-grid,.sk-muts{grid-template-columns:1fr}
